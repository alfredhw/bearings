<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Bearings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Bearings: a short, self-paced course in research and AI literacy, in six modules.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400&display=swap">
<style>
:root {
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  --paper: #fafafa;
  --paper-raised: #ffffff;
  --paper-sunk: #f1f3f5;
  --ink: #1d2329;
  --ink-muted: #5a6470;
  --slate: #2b5f9e;
  --slate-tint: #e7eef8;
  --green: #2f6b45;
  --green-tint: #e6f1e9;
  --sepia: #8a5a2b;
  --signal: #2b5f9e;
  --on-signal: #ffffff;
  --hairline: #e3e6ea;
  --rule: #c4c9d0;
  --wrong: #a3402c;
  --wrong-tint: #fbece8;
  --seg: #e9ecef;
  --seg-ink: #5a6470;

  --f-display: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --f-text: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-label: "Public Sans", "Helvetica Neue", Arial, sans-serif;

  --s-1: 0.75rem; --s-2: 0.875rem; --s-3: 1rem; --s-4: 1.125rem; --s-5: 1.375rem; --s-6: 1.75rem; --s-7: 2.5rem; --s-8: 3.5rem;
  --measure: 40rem;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15181c; --paper-raised: #1c2025; --paper-sunk: #111417;
    --ink: #dfe3e8; --ink-muted: #9aa3ad; --seg: #262c33; --seg-ink: #9aa3ad;
    --slate: #8db4e6; --slate-tint: #1f2c3d;
    --green: #8cc79f; --green-tint: #1a2a20;
    --sepia: #d6a874; --signal: #8db4e6; --on-signal: #0d1520;
    --hairline: #2a2f36; --rule: #48515b;
    --wrong: #e39a86; --wrong-tint: #3a211c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15181c; --paper-raised: #1c2025; --paper-sunk: #111417;
  --ink: #dfe3e8; --ink-muted: #9aa3ad; --seg: #262c33; --seg-ink: #9aa3ad;
  --slate: #8db4e6; --slate-tint: #1f2c3d;
  --green: #8cc79f; --green-tint: #1a2a20;
  --sepia: #d6a874; --signal: #8db4e6; --on-signal: #0d1520;
  --hairline: #2a2f36; --rule: #48515b;
  --wrong: #e39a86; --wrong-tint: #3a211c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-text);
  font-size: var(--s-3);
  line-height: 1.6;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: var(--signal); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, label:focus-within {
  outline: 2px solid var(--signal); outline-offset: 2px;
}
code { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 0.88em; background: var(--paper-sunk); padding: 0 0.25em; overflow-wrap: anywhere; }
h1, h2, h3 { text-wrap: balance; font-weight: 700; letter-spacing: -0.015em; margin: 0; }
p { margin: 0; }
ul { margin: 0; padding-left: 1.2em; }
li + li { margin-top: 0.35em; }

/* Default .label: quiet sentence-case sans-serif */
.label {
  font-family: var(--f-label);
  font-weight: 600;
  font-size: 0.82rem;
  text-transform: none;
  letter-spacing: 0;
  color: var(--ink-muted);
  line-height: 1.35;
}
/* Reserve small-caps / uppercase strictly for box titles, figure bars, and table headers */
.how .label,
.fig-cap .label,
.ev-label,
.chart-wrap > .label,
table.log th {
  font-family: var(--f-label);
  font-weight: 600;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 68rem; margin: 0 auto; }

/* ── Masthead ── */
.masthead {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); border-bottom: 1px solid var(--rule);
}
.masthead .inner { display: flex; flex-direction: column; gap: 8px; padding-block: 10px 10px; }
.mast-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand .wordmark { font-family: var(--f-label); font-weight: 700; letter-spacing: -0.01em; font-size: 1.15rem; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav a {
  font-family: var(--f-label); font-weight: 500; font-size: 0.9rem;
  color: var(--ink-muted); text-decoration: none; padding: 4px 8px; border: 1px solid transparent; border-radius: var(--radius);
}
.nav a:hover { color: var(--ink); border-color: var(--hairline); }
.nav a[aria-current="page"] { border-color: transparent; background: var(--slate-tint); color: var(--slate); }

.scalebar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.scalebar a {
  display: block; text-decoration: none; text-align: center; padding: 1px 0;
  font-family: var(--f-label); font-weight: 600; font-size: 12px;
  background: var(--seg); color: var(--seg-ink); border-radius: 4px;
}
.scalebar a:hover { color: var(--ink); }
.scalebar a.done { background: var(--green); color: var(--paper-raised); }
.scalebar a.here { background: var(--signal); color: var(--on-signal); }

main .inner { padding-block: 32px 64px; display: flex; flex-direction: column; gap: 48px; }

/* ── Hero / Cover ── */
.hero { display: flex; flex-direction: column; gap: 14px; padding-block: 16px 8px; max-width: 46rem; }
.hero h1 { font-family: var(--f-display); font-size: clamp(2.8rem, 8vw, 4.2rem); line-height: 1; letter-spacing: -0.03em; }
.hero .sub { font-size: 1.25rem; line-height: 1.5; color: var(--ink-muted); max-width: 38rem; }
a.btn-link {
  display: inline-block; font-family: var(--f-label); font-weight: 600; font-size: 0.95rem; text-decoration: none;
  background: var(--signal); color: var(--on-signal); padding: 10px 18px; border-radius: var(--radius);
}
a.btn-link:hover { filter: brightness(1.08); }

.neatline { border: 3px solid var(--ink); padding: 5px; }
.neatline > .neat-inner { border: 1.5px solid var(--rule); display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); min-height: 22rem; }
.cartouche { padding: 32px 28px; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; }
.cartouche h1 { font-family: var(--f-display); font-size: clamp(3rem, 9vw, 5.5rem); line-height: 0.95; letter-spacing: -0.01em; }
.cartouche .sub { font-style: italic; font-size: var(--s-5); line-height: 1.35; max-width: 30rem; color: var(--ink); }
.cartouche .short-rule { width: 64px; height: 0; border-top: 1.5px solid var(--ink); }
.credit { display: flex; align-items: center; gap: 10px; }
.credit .label { color: var(--ink); }
.field { background: var(--slate); position: relative; min-height: 14rem; border-left: 1.5px solid var(--rule); }
.field canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.field .field-cap { position: absolute; left: 12px; bottom: 10px; color: var(--paper); opacity: 0.85; }
@media (max-width: 720px) {
  .neatline > .neat-inner { grid-template-columns: 1fr; }
  .field { border-left: 0; border-top: 1.5px solid var(--rule); min-height: 9rem; order: -1; }
  .cartouche { padding: 24px 18px; }
}

/* ── Sections ── */
.section { display: flex; flex-direction: column; gap: 16px; }
.section-head { display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--hairline); padding-bottom: 8px; }
.section-head h2 { font-family: var(--f-display); font-size: 1.45rem; line-height: 1.25; }
.prose { max-width: var(--measure); display: flex; flex-direction: column; gap: 14px; font-size: var(--s-4); line-height: 1.65; }
.prose ul { display: flex; flex-direction: column; gap: 6px; }
.prose li + li { margin-top: 0; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 18rem); gap: 40px; align-items: start; }
@media (max-width: 860px) { .two-col { grid-template-columns: 1fr; gap: 24px; } }

.legend { background: var(--paper-raised); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.legend-title { font-family: var(--f-label); font-weight: 600; font-size: 0.95rem; color: var(--ink); border-bottom: 1px solid var(--hairline); padding-bottom: 6px; }
.legend dl { margin: 0; display: flex; flex-direction: column; gap: 10px; }
.legend .row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-items: start; }
.legend .sw { display: none; }
.legend dt { font-weight: 700; font-size: var(--s-2); line-height: 1.35; }
.legend dd { margin: 2px 0 0; font-size: var(--s-2); line-height: 1.45; color: var(--ink-muted); }

/* ── Module header ── */
.plate-head { display: flex; flex-direction: column; gap: 8px; }
.plate-head h1 { font-family: var(--f-display); font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1.1; }
.plate-head .bearing { font-style: italic; font-size: 1.2rem; color: var(--ink-muted); }
.plate-meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--f-label); font-weight: 600; font-size: 0.78rem;
  padding: 2px 9px; border: 1px solid var(--rule); border-radius: 999px; color: var(--ink-muted); background: var(--paper);
  white-space: nowrap;
}
.chip.ok { border-color: var(--green); color: var(--green); background: var(--green-tint); }
.chip.here { border-color: var(--signal); color: var(--on-signal); background: var(--signal); }
.chip.part { border-color: var(--slate); color: var(--slate); background: var(--slate-tint); }

/* ── Module index ── */
.index { border-top: 1px solid var(--rule); }
.index a {
  display: grid; grid-template-columns: 3.2rem minmax(0, 1fr) auto; gap: 16px; align-items: center;
  padding: 14px 4px; border-bottom: 1px solid var(--hairline); text-decoration: none; color: var(--ink);
}
.index a:hover { background: var(--paper-raised); }
.index .num { font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; line-height: 1; color: var(--slate); text-align: center; }
.index .nm { font-size: var(--s-4); font-weight: 600; }
.index .br { font-style: italic; color: var(--ink-muted); font-size: var(--s-2); }
@media (max-width: 520px) {
  .index a { grid-template-columns: 2.4rem minmax(0, 1fr); }
  .index a .chip { grid-column: 2; justify-self: start; }
}

.how { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper-raised); }
.how > div { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.how > div + div { border-left: 1px solid var(--hairline); }
.how p { font-size: var(--s-2); color: var(--ink-muted); line-height: 1.5; }
@media (max-width: 860px) { .how { grid-template-columns: repeat(2, minmax(0, 1fr)); } .how > div:nth-child(3) { border-left: 0; } .how > div:nth-child(n+3) { border-top: 1px solid var(--hairline); } }
@media (max-width: 480px) { .how { grid-template-columns: 1fr; } .how > div + div { border-left: 0; border-top: 1px solid var(--hairline); } }

.note { font-size: var(--s-2); color: var(--ink-muted); max-width: var(--measure); line-height: 1.55; }

/* ── Figures (exercise / mastery) ── */
.fig { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper-raised); overflow: hidden; }
.fig-cap { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 14px; border-bottom: 1px solid var(--hairline); background: var(--paper-sunk); }
.fig-body { padding: 18px 16px; display: flex; flex-direction: column; gap: 24px; }
.fig-body > .intro { max-width: var(--measure); display: flex; flex-direction: column; gap: 10px; }
.part { display: flex; flex-direction: column; gap: 12px; padding-top: 18px; border-top: 1px solid var(--hairline); }
.part:first-of-type { border-top: 0; padding-top: 0; }
.part-prompt { font-weight: 700; max-width: var(--measure); }

.answer-block { background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; max-width: var(--measure); }
.answer-block .q { font-style: italic; color: var(--ink-muted); font-size: var(--s-2); }
.answer-block p { font-size: var(--s-3); }
.answer-block sup { color: var(--signal); font-family: var(--f-label); font-weight: 600; }

.items { display: flex; flex-direction: column; gap: 10px; }
.item { border: 1px solid var(--hairline); border-radius: var(--radius); background: var(--paper); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.item.right { border-color: var(--green); }
.item.wrong { border-color: var(--wrong); }
.item-text { font-size: var(--s-3); line-height: 1.5; }
.item-text .ref-n { font-family: var(--f-label); font-weight: 600; color: var(--signal); margin-right: 4px; }
.item-text .doi { display: block; margin-top: 4px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.82em; color: var(--ink-muted); overflow-wrap: anywhere; }
.item-text .cited-for { display: block; margin-top: 6px; font-style: italic; font-size: var(--s-2); color: var(--ink-muted); }

.seg { display: flex; flex-wrap: wrap; gap: 6px; border: 0; margin: 0; padding: 0; min-width: 0; }
.seg legend { padding: 0; margin-bottom: 4px; }
.seg label {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  border: 1px solid var(--rule); border-radius: var(--radius); padding: 5px 10px; font-size: var(--s-2); background: var(--paper); line-height: 1.3;
}
.seg input { accent-color: var(--signal); margin: 0; }
.seg label:has(input:checked) { border-color: var(--signal); background: var(--slate-tint); }
.seg.conf label { font-family: var(--f-label); font-weight: 500; font-size: 0.85rem; }

.opts { display: flex; flex-direction: column; gap: 6px; border: 0; margin: 0; padding: 0; min-width: 0; }
.opts label { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; cursor: pointer; padding: 8px 10px; border: 1px solid var(--hairline); border-radius: var(--radius); background: var(--paper); line-height: 1.45; }
.opts input { accent-color: var(--signal); margin: 3px 0 0; }
.opts label:has(input:checked) { border-color: var(--signal); background: var(--slate-tint); }
.opts label.is-key { border-color: var(--green); }

.fb { font-size: var(--s-2); line-height: 1.5; padding: 8px 10px; border-left: 3px solid var(--rule); border-radius: var(--radius); background: var(--paper-sunk); }
.fb.right { border-left-color: var(--green); background: var(--green-tint); }
.fb.wrong { border-left-color: var(--wrong); background: var(--wrong-tint); }
.fb strong { font-family: var(--f-label); font-weight: 600; margin-right: 6px; }

.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 12px; }
.fieldset { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fieldset label { font-size: var(--s-2); font-weight: 700; }
input[type="text"], textarea {
  font: inherit; font-size: var(--s-3); color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: var(--radius); padding: 8px 10px; width: 100%;
}
textarea { resize: vertical; line-height: 1.5; }
input[type="text"].right, textarea.right { border-color: var(--green); }
input[type="text"].wrong { border-color: var(--wrong); }
.hint { font-size: var(--s-1); color: var(--ink-muted); }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button.btn {
  font-family: var(--f-label); font-weight: 600; font-size: 0.95rem;
  border: 1.5px solid var(--signal); border-radius: var(--radius); background: var(--signal); color: var(--on-signal); padding: 9px 16px; cursor: pointer;
}
button.btn:hover { background: var(--slate); border-color: var(--slate); color: var(--on-signal); filter: brightness(1.08); }
button.btn.quiet { background: transparent; color: var(--ink); border-color: var(--rule); }
button.btn.quiet:hover { background: var(--paper-sunk); color: var(--ink); filter: none; }
button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
button.btn.danger { background: transparent; color: var(--wrong); border-color: var(--wrong); }
.status-line { font-family: var(--f-label); font-size: var(--s-2); color: var(--ink-muted); }

.verdict { border: 1.5px solid var(--ink); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: var(--paper); }
.verdict.pass { border-color: var(--green); background: var(--green-tint); }
.verdict.fail { border-color: var(--rule); }
.verdict h3 { font-size: var(--s-5); }
.stats { display: flex; gap: 20px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; }
.stat .v { font-family: var(--f-text); font-size: var(--s-6); line-height: 1.1; font-variant-numeric: tabular-nums; }

.mq-num { font-family: var(--f-label); font-weight: 600; color: var(--signal); font-size: 0.82rem; }

.evidence { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); }
.evidence > div { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.evidence > div + div { border-left: 1px solid var(--hairline); }
.evidence p { font-size: var(--s-2); line-height: 1.5; }
.ev-label { color: var(--sepia); }
@media (max-width: 720px) { .evidence { grid-template-columns: 1fr; } .evidence > div + div { border-left: 0; border-top: 1px solid var(--hairline); } }

.citation-sample { margin-top: 10px; font-weight: 400; padding: 10px 12px; background: var(--paper-sunk); border-left: 3px solid var(--rule); font-size: var(--s-2); line-height: 1.55; padding-left: 2.2em; text-indent: -1.2em; }

.plate-nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 14px; }
.plate-nav a { text-decoration: none; display: flex; flex-direction: column; gap: 2px; color: var(--ink); }
.plate-nav a:hover .nm { text-decoration: underline; }
.plate-nav .nm { font-size: var(--s-4); font-weight: 600; }
.plate-nav a.next { text-align: right; margin-left: auto; }

/* ── Record ── */
.chart-wrap { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper-raised); padding: 12px; overflow-x: auto; }
.chart-wrap svg { display: block; width: 100%; max-width: 40rem; height: auto; }
table.log { border-collapse: collapse; width: 100%; font-size: var(--s-2); font-variant-numeric: tabular-nums; }
.table-scroll { overflow-x: auto; }
table.log th { text-align: left; background: var(--paper-sunk); color: var(--ink-muted); }
table.log th, table.log td { padding: 6px 10px; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
.code-box { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; }

/* ── Certificate ── */
.cert { background: var(--paper-raised); }
.neatline.cert { border: 1px solid var(--rule); padding: 0; border-radius: 10px; overflow: hidden; }
.neatline.cert > .neat-inner { border: 0; border-top: 8px solid var(--signal); display: flex; flex-direction: column; gap: 18px; padding: 32px 28px; min-height: 0; }
.cert h2 { font-family: var(--f-display); font-weight: 700; font-size: clamp(2rem, 5vw, 2.6rem); line-height: 1; }
.cert .name { font-family: var(--f-display); font-weight: 700; font-size: clamp(2.5rem, 7vw, 3.8rem); line-height: 1.05; letter-spacing: -0.02em; color: var(--slate); overflow-wrap: anywhere; }
.cert .plates { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 0; gap: 4px; }
.cert .plates div { padding: 6px 6px; text-align: center; display: flex; flex-direction: column; gap: 2px; background: var(--green); color: var(--paper); border-radius: 4px; }
.cert .plates .r { font-family: var(--f-label); font-weight: 600; font-size: 13px; }
.cert .plates .d { font-family: var(--f-label); font-size: 11px; opacity: 0.85; }

<p>Most searching is confirming. You have an answer, you look for support, and the first result that agrees ends the search. Searching to test means also looking for the evidence that would complicate or overturn the answer.</p>

<li><strong>The collection.</strong> What the tool can reach at all. Google Scholar, a library search and an AI research tool each cover different material, and none covers everything.</li>

<p>Once you have the evidence, you have to decide what it supports. Two ideas do most of the work.</p>
<p><strong>Fit for purpose.</strong> Sources aren't good or bad in the abstract. They are good for something. A lab experiment is strong evidence about what happened in that lab and weaker evidence about every classroom. A newspaper column is weak evidence that handwriting helps learning, and good evidence that people believe it does. Ask what you need the source to show, then ask whether it can show that.</p>
<p><strong>A body of evidence beats a single study.</strong> One study can be a fluke, a product of its particular sample, or simply wrong. Replications, reviews and meta-analyses tell you whether a result holds up. Peer review checks that a paper is reasonable to publish. It doesn't certify that the conclusion is final.</p>
<p>Then there is the question of how sure to be. Being calibrated means your confidence matches how often you turn out to be right. If you say “certain” about ten things, close to all ten should be true. If only six are, your certainty was worth less than it sounded.</p>

    n: 5, roman: "V", slug: "cite", name: "Cite",
    bearing: "Leave a trail others can follow.",
    minutes: 40,
    reading: `
<p>Citation is tracing in reverse. In Module 2 you followed other people's trails back to their sources. When you cite, you leave a trail for your reader. That is why citation exists: so a reader can find exactly what you used and check whether it says what you say it does.</p>
<p>Every element in a citation does a job. The authors and year identify the work. The title confirms it. The journal, volume and pages, or the DOI, take the reader to the exact item. A citation with a wrong element is a trail with a broken step. That is also why you check citation generators against the source itself. They often get a year, a capitalization or an author's name wrong.</p>
<p>A few rules follow from the purpose:</p>
<ul>
<li><strong>Cite ideas, not just words.</strong> A paraphrase still came from somewhere.</li>
<li><strong>Cite the source, not the tool that found it.</strong> If an AI tool pointed you to an article, read the article and cite it.</li>
<li><strong>Be honest about secondhand sources.</strong> If you only read about a study in another article, say so.</li>
<li><strong>Use the style your instructor or field expects.</strong> Styles differ in format, not in purpose.</li>

<p>Disclosing AI use is the same act. When you say which tool you used, what you used it for and how you checked its output, you make your process traceable. Follow each course's policy; they differ, and the instructor's policy decides.</p>

const confScore = brier => brier == null ? null : Math.max(0, Math.round(100 * (1 - brier / 0.25)));
const pOf = id => (CONFIDENCE.find(c => c.id === id) || CONFIDENCE[0]).p;
const setBrier = items => items.reduce((t, r) => t + Math.pow(pOf(r.conf) - (r.ok ? 1 : 0), 2), 0) / items.length;
function status(n) {
  if (mastered(n)) return { cls: "ok", text: "Mastered" };
  const p = S.plates[n];
  if (!p) return { cls: "", text: "Not started" };
  const bits = [];
  if (exPassed(n)) bits.push("Exercise done");
  if (mPassed(n)) bits.push("Check passed");
  if (bits.length) return { cls: "part", text: bits.join(" · ") };
  if (p.mastery.attempts.length || Object.keys(p.ex.parts).length) return { cls: "part", text: "In progress" };
  return { cls: "", text: "Not started" };
}

/* all mastery responses, for calibration */
function allResponses() {
  const out = [];
  PLATES.forEach(p => { const st = S.plates[p.n]; if (!st) return; st.mastery.attempts.forEach(a => a.items.forEach(it => out.push(it))); });
  return out;
}
function calib() {
  const every = allResponses();
  const rs = every.filter(r => r.first !== false);
  const levels = CONFIDENCE.map(c => {
    const at = rs.filter(r => r.conf === c.id);
    const right = at.filter(r => r.ok).length;
    return { ...c, n: at.length, right, rate: at.length ? right / at.length : null };
  });
  const n = rs.length;
  const right = rs.filter(r => r.ok).length;
  const brier = n ? rs.reduce((s, r) => s + Math.pow(pOf(r.conf) - (r.ok ? 1 : 0), 2), 0) / n : null;
  const meanConf = n ? rs.reduce((s, r) => s + pOf(r.conf), 0) / n : null;
  return { n, all: every.length, right, acc: n ? right / n : null, brier, score: confScore(brier), meanConf, gap: n ? meanConf - right / n : null, levels };
}

/* ───────────── exercise parts ───────────── */
function renderPart(n, part) {
  const saved = (P(n).ex.parts[part.id] || {}).val || {};
  const pid = `p${n}-${part.id}`;
  const head = `<div class="part-prompt" id="${pid}-prompt">${part.prompt}</div>`;
  if (part.type === "tag") {
    return `<div class="part" data-part="${part.id}">${head}<div class="items">${part.items.map(it => `
      <div class="item" data-item="${it.id}">
        <div class="item-text" id="${pid}-${it.id}-t">${it.text}</div>
        <fieldset class="seg" aria-labelledby="${pid}-${it.id}-t" aria-describedby="${pid}-prompt">${part.options.map((o, oi) => `<label><input type="radio" name="${pid}-${it.id}" id="${pid}-${it.id}-${oi}" value="${oi}" ${String(saved[it.id]) === String(oi) ? "checked" : ""}>${esc(o)}</label>`).join("")}</fieldset>
        <div class="fb-slot"></div>
      </div>`).join("")}</div><div class="fb-slot"></div></div>`;
  }
  if (part.type === "choice") {
    const order = part._order || (part._order = shuffle(part.options.map((_, i) => i)));
    return `<div class="part" data-part="${part.id}">${head}<fieldset class="opts" aria-labelledby="${pid}-prompt">${order.map(i => `<label><input type="radio" name="${pid}" id="${pid}-${i}" value="${i}" ${String(saved.choice) === String(i) ? "checked" : ""}><span>${part.options[i].text}</span></label>`).join("")}</fieldset><div class="fb-slot"></div></div>`;
  }
  if (part.type === "fields") {
    return `<div class="part" data-part="${part.id}">${head}<div class="fields">${part.fields.map(f => `
      <div class="fieldset"><label for="${pid}-${f.id}">${esc(f.label)}</label><input type="text" id="${pid}-${f.id}" data-field="${f.id}" placeholder="${esc(f.placeholder || "")}" value="${esc(saved[f.id] || "")}" autocomplete="off" spellcheck="false"></div>`).join("")}</div><div class="fb-slot"></div></div>`;
  }
  if (part.type === "predict") {
    return `<div class="part" data-part="${part.id}">${head}<div class="items">${part.items.map(it => `
      <div class="item" data-item="${it.id}">
        <div class="item-text" id="${pid}-${it.id}-t">${esc(it.label)}</div>
        <fieldset class="seg" aria-describedby="${pid}-${it.id}-t"><legend class="label">My prediction</legend>${part.choices.map((c, ci) => `<label><input type="radio" name="${pid}-${it.id}-pre" id="${pid}-${it.id}-pre-${ci}" value="${esc(c)}" ${(saved[it.id + "_pre"] === c) ? "checked" : ""}>${esc(c)}</label>`).join("")}</fieldset>
        <fieldset class="seg" aria-describedby="${pid}-${it.id}-t"><legend class="label">What happened</legend>${["Yes", "No", "Didn't try"].map((c, ci) => `<label><input type="radio" name="${pid}-${it.id}-post" id="${pid}-${it.id}-post-${ci}" value="${esc(c)}" ${(saved[it.id + "_post"] === c) ? "checked" : ""}>${esc(c)}</label>`).join("")}</fieldset>
      </div>`).join("")}</div><div class="fb-slot"></div></div>`;
  }
  if (part.type === "write") {
    return `<div class="part" data-part="${part.id}">${head}<div style="display:flex;flex-direction:column;gap:12px;max-width:var(--measure)">${part.fields.map(f => `
      <div class="fieldset"><label for="${pid}-${f.id}">${esc(f.label)}</label><textarea id="${pid}-${f.id}" data-field="${f.id}" rows="${f.rows || 2}" placeholder="${esc(f.placeholder || "")}">${esc(saved[f.id] || "")}</textarea>${f.min ? `<span class="hint">At least ${f.min} characters.</span>` : ""}</div>`).join("")}</div>${checksHTML(pid, part, saved)}<div class="fb-slot"></div></div>`;
  }
  return "";
}

function checksHTML(pid, part, saved) {
  if (!part.checks) return "";
  return `<fieldset class="checks"><legend>${esc(part.checksLabel || "Check your work")}</legend>${part.checks.map((c, i) => `<label><input type="checkbox" id="${pid}-chk${i}" data-check="${i}" ${saved["check_" + i] ? "checked" : ""}><span>${esc(c)}</span></label>`).join("")}</fieldset>`;
}
function readChecks(root, val) { $$("[data-check]", root).forEach(el => { val["check_" + el.dataset.check] = el.checked; }); }

function readPart(n, part) {
  const root = $(`[data-part="${part.id}"]`);
  const pid = `p${n}-${part.id}`;
  const val = {};
  if (!root) return val;
  if (part.type === "tag") part.items.forEach(it => { const c = $(`input[name="${pid}-${it.id}"]:checked`, root); if (c) val[it.id] = c.value; });
  if (part.type === "choice") { const c = $(`input[name="${pid}"]:checked`, root); if (c) val.choice = c.value; }
  if (part.type === "fields" || part.type === "write") { $$("[data-field]", root).forEach(el => { val[el.dataset.field] = el.value; }); readChecks(root, val); }
  if (part.type === "predict") part.items.forEach(it => {
    const a = $(`input[name="${pid}-${it.id}-pre"]:checked`, root), b = $(`input[name="${pid}-${it.id}-post"]:checked`, root);
    if (a) val[it.id + "_pre"] = a.value; if (b) val[it.id + "_post"] = b.value;
  });
  return val;
}

function gradePart(n, part, val) {
  const root = $(`[data-part="${part.id}"]`);
  const slot = root.querySelector(":scope > .fb-slot");
  if (part.type === "tag") {
    let right = 0, missing = 0;
    part.items.forEach(it => {
      const box = $(`[data-item="${it.id}"]`, root);
      const s = $(".fb-slot", box);
      box.classList.remove("right", "wrong");
      if (val[it.id] == null) { missing++; s.innerHTML = ""; return; }
      const ok = Number(val[it.id]) === it.key;
      if (ok) right++;
      box.classList.add(ok ? "right" : "wrong");
      s.innerHTML = `<div class="fb ${ok ? "right" : "wrong"}"><strong>${ok ? "Yes" : "Not quite"}</strong>${ok ? "" : `The better answer is “${esc(part.options[it.key])}.” `}${it.why}</div>`;
    });
    const need = part.threshold || part.items.length;
    const pass = !missing && right >= need;
    slot.innerHTML = missing ? `<div class="fb">Answer all ${part.items.length} to finish this part.</div>` : `<div class="fb ${pass ? "right" : "wrong"}"><strong>${right} of ${part.items.length}</strong>${pass ? "That clears this part." : `You need ${need} to clear this part. Read the notes above and try again.`}</div>`;
    return pass;
  }
  if (part.type === "choice") {
    $$("label", root).forEach(l => l.classList.remove("is-key"));
    if (val.choice == null) { slot.innerHTML = `<div class="fb">Choose an answer.</div>`; return false; }
    const opt = part.options[Number(val.choice)];
    const ok = !!opt.correct;
    if (ok) { const keyIdx = part.options.findIndex(o => o.correct); const inp = $(`input[value="${keyIdx}"]`, root); if (inp) inp.closest("label").classList.add("is-key"); }
    slot.innerHTML = `<div class="fb ${ok ? "right" : "wrong"}"><strong>${ok ? "Yes" : "Not quite"}</strong>${opt.why}</div>`;
    return ok;
  }
  if (part.type === "fields") {
    let right = 0, empty = 0; const notes = [];
    part.fields.forEach(f => {
      const el = $(`[data-field="${f.id}"]`, root);
      el.classList.remove("right", "wrong");
      const v = norm(val[f.id], f.normalize);
      if (!v) { empty++; return; }
      const ok = f.accept.some(a => norm(a, f.normalize) === v);
      el.classList.add(ok ? "right" : "wrong");
      if (ok) right++;
      if (ok && f.why && part.fields.length === 1) notes.push(f.why);
      if (!ok) notes.push(`<em>${esc(f.label)}:</em> check this against the record.`);
      if (ok && f.id === "year" && v === "2012") notes.push(f.why);
    });
    const need = part.threshold || part.fields.length;
    const pass = !empty && right >= need;
    slot.innerHTML = empty ? `<div class="fb">Fill in every box to finish this part.</div>` :
      `<div class="fb ${pass ? "right" : "wrong"}"><strong>${right} of ${part.fields.length}</strong>${notes.join(" ")}</div>`;
    return pass;
  }
  if (part.type === "predict") {
    const complete = part.items.every(it => val[it.id + "_pre"] && val[it.id + "_post"]);
    if (!complete) { slot.innerHTML = `<div class="fb">Record a prediction and a result for each line. There are no wrong predictions; this part counts when it's filled in.</div>`; return false; }
    const tried = part.items.filter(it => val[it.id + "_post"] !== "Didn't try");
    const skipped = part.items.length - tried.length;
    const firm = tried.filter(it => val[it.id + "_pre"] !== "Not sure");
    const surprises = firm.filter(it => val[it.id + "_pre"] !== val[it.id + "_post"]).length;
    const unsure = tried.length - firm.length;
    const bits = [];
    if (!tried.length) bits.push("You didn't run any of the searches, so there's nothing to compare yet. They're worth trying when you can: the gap between a prediction and a result is where you learn how a tool works.");
    else {
      if (surprises) bits.push(`${surprises} of the searches you ran came out differently from your prediction. Those are the places a tool works differently from how you pictured it.`);
      else if (firm.length) bits.push(`Your predictions matched the ${firm.length === 1 ? "search" : "searches"} you ran.`);
      if (unsure) bits.push(`You weren't sure about ${unsure} of the searches you ran; now you've seen what happens.`);
      if (skipped) bits.push(`You skipped ${skipped}, so what ${skipped === 1 ? "that tool does" : "those tools do"} is still an open question.`);
    }
    slot.innerHTML = `<div class="fb right"><strong>Recorded</strong>${bits.join(" ")}</div>`;
    return true;
  }
  if (part.type === "write") {
    if (part.optional) {
      const any = part.fields.some(f => (val[f.id] || "").trim());
      slot.innerHTML = any ? `<div class="fb right"><strong>Recorded</strong>${esc(part.doneMsg || "")}</div>` : "";
      return true;
    }
    const short = part.fields.filter(f => (val[f.id] || "").trim().length < f.min);
    const unchecked = (part.checks || []).filter((_, i) => !val["check_" + i]).length;
    const bits = [];
    if (short.length) bits.push(`Add a bit more detail to: ${short.map(f => esc(f.label)).join("; ")}.`);
    if (unchecked) bits.push(`Tick each item in the checklist once it's true of your work.`);
    slot.innerHTML = bits.length ? `<div class="fb wrong"><strong>A little more</strong>${bits.join(" ")}</div>` : `<div class="fb right"><strong>Recorded</strong>${esc(part.doneMsg || "Recorded.")}</div>`;
    $$("textarea", root).forEach(t => t.classList.toggle("right", !short.find(f => f.id === t.dataset.field)));
    return !bits.length;
  }
  return true;
}

function checkExercise(n) {
  const p = plateBy(n); const st = P(n);
  let allPass = true;
  p.exercise.parts.forEach(part => {
    const val = readPart(n, part);
    const pass = gradePart(n, part, val);
    st.ex.parts[part.id] = { val, pass };
    if (!pass && !part.optional) allPass = false;
  });
  const was = st.ex.passed;
  st.ex.passed = allPass;
  if (allPass && !st.ex.passedAt) st.ex.passedAt = new Date().toISOString();
  if (!allPass && !was) st.ex.passedAt = st.ex.passedAt || null;
  if (was) st.ex.passed = true; // once complete, stays complete
  save();
  $("#ex-msg").textContent = st.ex.passed ? (mPassed(n) ? `Exercise complete. This ${u} is mastered.` : "Exercise complete. Now take the mastery check.") : "Not complete yet. The notes above show what to revisit.";
  $("#ex-status").innerHTML = st.ex.passed ? chip({ cls: "ok", text: "Complete" }) : "";
  renderScalebar(n);
}

let saveTimer = null;
function autosaveExercise(n, target) {
  const box = target.closest("[data-part]"); if (!box || !box.closest("#exercise")) return;
  const part = plateBy(n).exercise.parts.find(q => q.id === box.dataset.part); if (!part) return;
  const st = P(n); const prev = st.ex.parts[part.id] || {};
  st.ex.parts[part.id] = { val: readPart(n, part), pass: !!prev.pass };
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { save(); const m = $("#ex-msg"); if (m) m.textContent = storageOK ? "Draft saved in this browser." : "This browser isn't letting the page save. Copy your work before leaving."; }, 300);
}

/* ───────────── mastery check ───────────── */
let current = null; // { n, items: [{qi, order}] }
function drawSet(n) {
  const p = plateBy(n); const st = P(n);
  const seen = st.seen || (st.seen = {});
  const idx = shuffle(p.bank.map((_, i) => i)).sort((a, b) => (seen[a] || 0) - (seen[b] || 0));
  const items = idx.slice(0, MASTERY.draw).map(qi => ({ qi, order: shuffle(p.bank[qi].a.map((_, i) => i)) }));
  st.pending = { items, ans: {} }; save();
  return { n, items };
}

    <line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--ink)" stroke-width="1.5"/>
    ${pts.length > 1 ? `<polyline points="${pts.map(l => `${x(l.p)},${y(l.rate)}`).join(" ")}" fill="none" stroke="var(--slate)" stroke-width="2"/>` : ""}

    ${pts.length ? "" : `<text x="${(L + W - R) / 2}" y="${H / 2 - 10}" text-anchor="middle" font-size="14" fill="var(--ink-muted)" font-style="italic" style="font-family:var(--f-text)">Take a mastery check to plot your first points.</text>`}
  </svg>`;
}

function bearingText() { const v = ((S.plates[6] || {}).ex || {}).parts; return (v && v.bearing && v.bearing.val) || {}; }

  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(payload));
    const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("").toUpperCase();
    return `${hex.slice(0, 4)}-${hex.slice(4, 8)}-${hex.slice(8, 12)}`;
  } catch (e) {
    let h = 2166136261; for (let i = 0; i < payload.length; i++) { h ^= payload.charCodeAt(i); h = Math.imul(h, 16777619); }
    const hex = (h >>> 0).toString(16).toUpperCase().padStart(8, "0"); return `${hex.slice(0, 4)}-${hex.slice(4, 8)}`;
  }
}

  if (!courseDone()) {
    return `<header class="plate-head"><h1>Certificate</h1><p class="bearing">The certificate appears when all six ${u}s are mastered and the final step is done.</p></header>
    <section class="section"><ul class="checklist">${PLATES.map(p => `<li>${chip(status(p.n))}<a href="#${u}-${p.n}">${U} ${N(p)} · ${esc(p.name)}</a>${!mastered(p.n) ? `<span class="status-line">${exPassed(p.n) ? "" : "exercise"}${!exPassed(p.n) && !mPassed(p.n) ? " and " : ""}${mPassed(p.n) ? "" : "mastery check"} to go</span>` : ""}</li>`).join("")}
    <li>${chip(finalDone() ? { cls: "ok", text: "Done" } : { cls: "", text: "Not done" })}<a href="#final">Final step · ${esc(FINAL.name)}</a></li></ul>
    <p class="note">A ${u} is mastered when its field exercise is complete and its mastery check is passed: at least ${MASTERY.needCorrect} of ${MASTERY.draw} correct, no wrong answer marked Certain, and a confidence score of at least ${MASTERY.minScore}.</p></section>`;
  }
  const c = calib(); const b = bearingText();
  return `<header class="plate-head no-print"><h1>All six ${u}s mastered</h1><p class="bearing">Enter your name as you want it to appear on your certificate.</p></header>
  <section class="section no-print"><div class="fields" style="max-width:var(--measure)"><div class="fieldset"><label for="cert-name">Name on certificate</label><input type="text" id="cert-name" value="${esc(S.name || "")}" placeholder="Your name" autocomplete="name"></div></div></section>
  <section class="neatline cert" aria-label="Certificate">
    <div class="neat-inner">
      <span class="label">Bearings · A short course in research and AI literacy</span>
      <h2>Certificate of completion</h2>
      <p>This records that</p>
      <div class="name" id="cert-name-out">${esc(S.name || "Your name")}</div>
      <p style="max-width:var(--measure)">completed all six ${u}s of Bearings, mastering each move: interrogating an answer, tracing claims to their sources, searching to test, weighing evidence, citing, and asking better questions, and wrote a revised answer of their own. Completed ${fmtDate(completedOn())}.</p>
      <div class="plates">${PLATES.map(p => `<div><span class="r">${N(p)}</span><span class="d">${fmtDate(masteredAt(p.n))}</span></div>`).join("")}</div>
      <div class="stats">
        <div class="stat"><span class="label">Mastery questions</span><span class="v">${c.all}</span></div>
        <div class="stat"><span class="label">Correct, first time</span><span class="v">${Math.round(c.acc * 100)}%</span></div>
        <div class="stat"><span class="label">Mean confidence</span><span class="v">${Math.round(c.meanConf * 100)}%</span></div>
        <div class="stat"><span class="label">Confidence score</span><span class="v">${c.score} / 100</span></div>
      </div>
      ${b.question ? `<div style="display:flex;flex-direction:column;gap:6px"><span class="label">Bearing taken</span><p class="q">${esc(b.question)}</p></div>` : ""}
      ${S.final && S.final.val && S.final.val.answer ? `<div class="cert-answer"><span class="label">Revised answer</span><div class="q">${paras(S.final.val.answer)}</div></div>` : ""}
      <div class="cert-foot">
        <div class="credit">${station(22)}<span class="label">${CREDIT}</span></div>
        <span class="label">Record <span id="cert-code">····-····-····</span></span>
      </div>
      <p class="hint">Self-issued. Bearings keeps no records and no one has reviewed this certificate; it is a statement of work the holder completed.</p>
    </div>
  </section>
  <section class="section no-print">
    <div class="btn-row" id="cert-actions"><button class="btn" type="button" id="cert-png">Save as image</button><button class="btn quiet" type="button" id="cert-print" hidden>Print</button><span class="status-line" id="cert-msg"></span></div>
  </section>`;
}

async function drawCertificate() {
  const c = calib(); const b = bearingText(); const code = await recordCode();
  const CC = T.canvas || {};
  try { await Promise.all((CC.fontsToLoad || ["400 64px 'Libre Caslon Display'", "400 20px 'Libre Caslon Text'", "italic 400 20px 'Libre Caslon Text'", "600 16px 'Barlow Condensed'"]).map(f => document.fonts.load(f))); } catch (e) {}
  const W = 1650, H = 1275; // 11 x 8.5 at 150 dpi
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  const ink = CC.ink || "#1b2731", muted = CC.muted || "#4a5863", rule = CC.rule || "#7d8a8c", paper = CC.paper || "#fafbf8", slate = CC.slate || "#2c4a62", signal = CC.signal || "#086a76", stripText = CC.stripText || "#d5e1e8";
  const FD = CC.display || "'Libre Caslon Display', Georgia, serif", FT = CC.text || "'Libre Caslon Text', Georgia, serif", FL = CC.label || "'Barlow Condensed', 'Arial Narrow', sans-serif", DW = CC.displayWeight || 400;
  g.fillStyle = paper; g.fillRect(0, 0, W, H);
  if (CC.simpleFrame) { g.strokeStyle = rule; g.lineWidth = 2; g.strokeRect(60, 60, W - 120, H - 120); g.fillStyle = signal; g.fillRect(60, 60, W - 120, 10); }
  else { g.strokeStyle = ink; g.lineWidth = 6; g.strokeRect(60, 60, W - 120, H - 120); g.strokeStyle = rule; g.lineWidth = 3; g.strokeRect(74, 74, W - 148, H - 148); }
  const label = (t, x, y, size = 20, col = muted, align = "left") => { g.font = `600 ${size}px ${FL}`; g.fillStyle = col; g.textAlign = align; if ("letterSpacing" in g) g.letterSpacing = (CC.upper === false ? 0 : size * 0.1) + "px"; g.fillText(CC.upper === false ? t : t.toUpperCase(), x, y); if ("letterSpacing" in g) g.letterSpacing = "0px"; };
  const wrap = (text, x, y, maxW, lh, font, col) => { g.font = font; g.fillStyle = col; g.textAlign = "left"; const words = String(text).split(/\s+/); let line = ""; for (const w of words) { const t = line ? line + " " + w : w; if (g.measureText(t).width > maxW && line) { g.fillText(line, x, y); y += lh; line = w; } else line = t; } if (line) g.fillText(line, x, y); return y + lh; };
  const X = 140;
  label("Bearings · A short course in research and AI literacy", X, 170, 22);
  g.font = `${DW} 80px ${FD}`; g.fillStyle = ink; g.textAlign = "left"; g.fillText("Certificate of completion", X, 270);
  g.font = `400 26px ${FT}`; g.fillText("This records that", X, 340);
  g.font = `${DW} 92px ${FD}`; g.fillStyle = slate;
  let nm = S.name || "Your name"; while (g.measureText(nm).width > W - 2 * X && nm.length > 3) nm = nm.slice(0, -2) + "…";
  g.fillText(nm, X, 450);
  let y = wrap(`completed all six ${u}s of Bearings, mastering each move: interrogating an answer, tracing claims to their sources, searching to test, weighing evidence, citing, and asking better questions, and wrote a revised answer of their own. Completed ${fmtDate(completedOn())}.`, X, 520, W - 2 * X, 36, `400 26px ${FT}`, ink);
  // plates strip
  const sy = y + 10, sw = (W - 2 * X) / 6;
  PLATES.forEach((p, i) => { g.fillStyle = CC.strip || ink; g.fillRect(X + i * sw, sy, sw, 70); g.strokeStyle = paper; g.lineWidth = 2; if (i) { g.beginPath(); g.moveTo(X + i * sw, sy); g.lineTo(X + i * sw, sy + 70); g.stroke(); } label(N(p), X + i * sw + sw / 2, sy + 32, 24, paper, "center"); label(fmtDate(masteredAt(p.n)), X + i * sw + sw / 2, sy + 58, 17, stripText, "center"); });
  y = sy + 130;
  const stats = [["Mastery questions", String(c.all)], ["Correct, first time", Math.round(c.acc * 100) + "%"], ["Mean confidence", Math.round(c.meanConf * 100) + "%"], ["Confidence score", c.score + " / 100"]];
  stats.forEach((s, i) => { const sx = X + i * 330; label(s[0], sx, y, 18); g.font = `400 40px ${FT}`; g.fillStyle = ink; g.textAlign = "left"; g.fillText(s[1], sx, y + 48); });
  y += 110;
  if (b.question) { label("Bearing taken", X, y, 18); g.fillStyle = signal; g.fillRect(X, y + 16, 5, 70); wrap(b.question.length > 220 ? b.question.slice(0, 217) + "…" : b.question, X + 22, y + 46, W - 2 * X - 30, 34, `italic 400 26px ${FT}`, ink); }
  // footer
  g.strokeStyle = rule; g.lineWidth = 1.5; g.beginPath(); g.moveTo(X, H - 190); g.lineTo(W - X, H - 190); g.stroke();
  if (!T.noMark) { g.strokeStyle = ink; g.lineWidth = 3; g.beginPath(); g.moveTo(X + 22, H - 160); g.lineTo(X + 44, H - 120); g.lineTo(X, H - 120); g.closePath(); g.stroke();
  g.fillStyle = signal; g.beginPath(); g.arc(X + 22, H - 133, 6, 0, Math.PI * 2); g.fill(); }
  label(CREDIT, T.noMark ? X : X + 62, H - 124, 22, ink);
  label("Record " + code, W - X, H - 124, 22, ink, "right");
  wrap("Self-issued. Bearings keeps no records and no one has reviewed this certificate; it is a statement of work the holder completed.", X, H - 92, W - 2 * X, 26, `italic 400 19px ${FT}`, muted);
  return cv;
}

async function saveCertificate() {
  const msg = $("#cert-msg"); msg.textContent = "Preparing image…";
  const cv = await drawCertificate();
  const blob = await new Promise(r => cv.toBlob(r, "image/png"));
  const filename = `Bearings-certificate-${(S.name || "learner").replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "")}.png`;
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use("downloads"); } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: blob }); msg.textContent = "Saved."; } catch (e) { msg.textContent = "The save was cancelled or isn't available here."; }
    return;
  }
  if (window.claude) { msg.textContent = "Saving files isn't available in this view. Open the hosted version of Bearings to save your certificate."; return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  msg.textContent = "Image saved to your downloads.";
}

/* ───────────── cover contours ───────────── */
function drawContours() {
  const cv = $("#contours"); if (!cv) return;
  const box = cv.parentElement.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, box.width * dpr); cv.height = Math.max(1, box.height * dpr);
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const line = css.getPropertyValue("--paper").trim() || "#f2f3ef";
  const sig = css.getPropertyValue("--signal").trim() || "#086a76";
  const w = box.width, h = box.height;
  const cx = w * 0.58, cy = h * 0.42;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const ph = [rnd() * 6.28, rnd() * 6.28, rnd() * 6.28];
  g.strokeStyle = line; g.globalAlpha = 0.55;
  for (let k = 1; k <= 16; k++) {
    const r = k * Math.max(w, h) * 0.045;
    g.lineWidth = k % 5 === 0 ? 1.6 : 0.8;
    g.beginPath();
    for (let a = 0; a <= 360; a += 3) {
      const t = a * Math.PI / 180;
      const rr = r * (1 + 0.16 * Math.sin(2 * t + ph[0] + k * 0.12) + 0.08 * Math.sin(3 * t + ph[1]) + 0.05 * Math.sin(5 * t + ph[2] - k * 0.2));
      const px = cx + rr * Math.cos(t) * 1.15, py = cy + rr * Math.sin(t) * 0.85;
      a ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath(); g.stroke();
  }
  // graticule ticks
  g.globalAlpha = 0.35; g.lineWidth = 0.6;
  for (let gx = 24; gx < w; gx += 48) { g.beginPath(); g.moveTo(gx, 0); g.lineTo(gx, h); g.stroke(); }
  for (let gy = 24; gy < h; gy += 48) { g.beginPath(); g.moveTo(0, gy); g.lineTo(w, gy); g.stroke(); }
  // station
  g.globalAlpha = 1; g.strokeStyle = line; g.lineWidth = 2;
  g.beginPath(); g.moveTo(cx, cy - 14); g.lineTo(cx + 13, cy + 9); g.lineTo(cx - 13, cy + 9); g.closePath(); g.stroke();
  g.fillStyle = sig; g.beginPath(); g.arc(cx, cy + 1.3, 3.5, 0, Math.PI * 2); g.fill();
}

/* ───────────── router ───────────── */
function route() {
  const h = (location.hash || "#key").slice(1);
  const view = $("#view");
  const m = new RegExp("^" + u + "-([1-6])$").exec(h);
  current = null;
  if (m) {
    const n = Number(m[1]);
    view.innerHTML = viewPlate(n);
    renderScalebar(n);
    renderMastery(n);
    document.title = `${U} ${N(plateBy(n))} · Bearings`;
  } else if (h === "final") {
    view.innerHTML = viewFinal(); renderScalebar(0); document.title = "Final step · Bearings";
  } else if (h === "reading") {
    view.innerHTML = viewReading(); renderScalebar(0);
    $('[data-nav="reading"]').setAttribute("aria-current", "page"); document.title = "Further reading · Bearings";
  } else if (h === "record") {
    view.innerHTML = viewRecord(); renderScalebar(0);
    $('[data-nav="record"]').setAttribute("aria-current", "page"); document.title = "Progress · Bearings";
  } else if (h === "certificate") {
    view.innerHTML = viewCertificate(); renderScalebar(0);
    $('[data-nav="certificate"]').setAttribute("aria-current", "page"); document.title = "Certificate · Bearings";
    if (courseDone()) {
      recordCode().then(code => { const el = $("#cert-code"); if (el) el.textContent = code; });
      if (!window.claude) { const pb = $("#cert-print"); if (pb) pb.hidden = false; }
    }
  } else {
    view.innerHTML = viewKey(); renderScalebar(0);
    $('[data-nav="key"]').setAttribute("aria-current", "page"); document.title = "Bearings";
    requestAnimationFrame(drawContours);
  }
  window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const m = new RegExp("^" + u + "-([1-6])$").exec((location.hash || "").slice(1)); const n = m ? Number(m[1]) : 0;
  if (t.id === "ex-check" && n) checkExercise(n);
  if ((t.id === "m-start" || t.id === "m-again") && n) { current = drawSet(n); renderMastery(n); $("#mastery").scrollIntoView({ block: "start" }); }
  if (t.dataset.jump) { const el = document.getElementById(t.dataset.jump); if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); }
  if (t.id === "final-check") checkFinal();
  if (t.id === "m-submit" && n) submitMastery(n);
  if (t.id === "code-copy") {
    const ta = $("#code-out"); const msg = $("#code-copy-msg");
    const fallback = () => { ta.focus(); ta.select(); msg.textContent = "Selected. Copy it with your keyboard or menu."; };
    try { navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = "Copied."; }, fallback); } catch (err) { fallback(); }
  }
  if (t.id === "code-load") {
    const msg = $("#code-load-msg"); const raw = $("#code-in").value.trim();
    try {
      if (!raw.startsWith("BRG1.")) throw 0;
      const obj = JSON.parse(decodeURIComponent(escape(atob(raw.slice(5)))));
      if (!obj || obj.v !== 1 || typeof obj.plates !== "object") throw 0;
      S = obj; save(); msg.textContent = "Progress loaded."; route();
    } catch (err) { msg.textContent = "That code didn't work. Copy the whole code, starting with BRG1."; }
  }
  if (t.id === "reset-ask") {
    $("#reset-zone").innerHTML = `<div class="inline-confirm"><span>Erase all progress in this browser?</span><button class="btn danger" type="button" id="reset-yes">Erase</button><button class="btn quiet" type="button" id="reset-no">Keep it</button></div>`;
  }
  if (t.id === "reset-yes") { S = blank(); save(); location.hash = "#key"; route(); }
  if (t.id === "reset-no") route();
  if (t.id === "cert-png") saveCertificate();
  if (t.id === "cert-print") window.print();
});
function onEdit(e) {
  const m = new RegExp("^" + u + "-([1-6])$").exec((location.hash || "").slice(1));
  if (m && e.target.closest("#exercise")) autosaveExercise(Number(m[1]), e.target);
  if (m && e.target.closest("#m-body") && current) { rememberMastery(Number(m[1])); updateMasteryCount(); }
  if (location.hash === "#final" && e.target.closest("[data-final]")) autosaveFinal();
}
document.addEventListener("change", onEdit);
document.addEventListener("input", e => {
  if (e.target.matches("textarea, input[type=text]")) onEdit(e);
  if (e.target.id === "cert-name") {
    S.name = e.target.value.slice(0, 80); save();
    const o = $("#cert-name-out"); if (o) o.textContent = S.name || "Your name";
    recordCode().then(code => { const el = $("#cert-code"); if (el) el.textContent = code; });
  }
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(drawContours, 150); });
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawContours); } catch (e) {}
new MutationObserver(drawContours).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
window.addEventListener("hashchange", route);
route();
})();

</script>
